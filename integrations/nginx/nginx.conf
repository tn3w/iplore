pid /tmp/nginx.pid;
events {}

http {
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    ignore_invalid_headers on;
    underscores_in_headers off;
    merge_slashes on;

    map $http_x_forwarded_for $iplore_forwarded {
        ""      $realip_remote_addr;
        default "$http_x_forwarded_for, $realip_remote_addr";
    }

    server {
        listen 8080;

        location = /_iplore {
            internal;
            proxy_pass http://sidecar:8080/?block_risk=0.5&block_service=tor_exit_node,anonymous_vpn&block_country=AU,US&block_category=hosting&allow_provider=Googlebot,Bingbot;
            include /etc/nginx/iplore_check.conf;
        }

        location = /_iplore_open {
            internal;
            proxy_pass http://sidecar:8080/?block_risk=0.5&block_service=tor_exit_node,anonymous_vpn;
            include /etc/nginx/iplore_check.conf;
        }

        location = /_iplore_allow_country {
            internal;
            proxy_pass http://sidecar:8080/?allow_country=US;
            include /etc/nginx/iplore_check.conf;
        }

        location = /_iplore_no_hosting {
            internal;
            proxy_pass http://sidecar:8080/?block_category=hosting&allow_provider=Googlebot,Bingbot;
            include /etc/nginx/iplore_check.conf;
        }

        location / {
            auth_request /_iplore;
            include /etc/nginx/iplore_headers.conf;
            proxy_pass http://upstream:8080;
        }

        location ~ ^/open(/|$) {
            auth_request /_iplore_open;
            include /etc/nginx/iplore_headers.conf;
            proxy_pass http://upstream:8080;
        }

        location ~ ^/allow-country(/|$) {
            auth_request /_iplore_allow_country;
            include /etc/nginx/iplore_headers.conf;
            proxy_pass http://upstream:8080;
        }

        location ~ ^/no-hosting(/|$) {
            auth_request /_iplore_no_hosting;
            include /etc/nginx/iplore_headers.conf;
            proxy_pass http://upstream:8080;
        }
    }
}
