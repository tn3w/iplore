auth_request_set $iplore_country $upstream_http_x_iplore_country;
auth_request_set $iplore_asn $upstream_http_x_iplore_asn;
auth_request_set $iplore_category $upstream_http_x_iplore_category;
auth_request_set $iplore_risk $upstream_http_x_iplore_risk;
auth_request_set $iplore_service $upstream_http_x_iplore_service;
auth_request_set $iplore_provider $upstream_http_x_iplore_provider;

proxy_set_header X-Iplore-Country $iplore_country;
proxy_set_header X-Iplore-Asn $iplore_asn;
proxy_set_header X-Iplore-Category $iplore_category;
proxy_set_header X-Iplore-Risk $iplore_risk;
proxy_set_header X-Iplore-Service $iplore_service;
proxy_set_header X-Iplore-Provider $iplore_provider;

proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
