<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iplore lookup</title>
<meta name="description" content="IP lookup in your browser: location, ASN, VPN, Tor">
<style>
  :root {
    --background: #fafafa; --surface: #fff; --text: #18181b; --muted: #71717a;
    --border: #e4e4e7; --accent: #2563eb; --danger: #dc2626;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0c0c0e; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa;
      --border: #27272a; --accent: #60a5fa; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--background); color: var(--text);
    font: 15px/1.5 system-ui, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0; font-size: 28px; }
  h2 { margin: 0; font: 600 16px ui-monospace, monospace; overflow-wrap: anywhere; }
  a { color: var(--accent); }
  .muted, #status { color: var(--muted); }
  form { display: flex; gap: 8px; margin-top: 24px; }
  input, button {
    font: inherit; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
  }
  input { flex: 1; min-width: 0; padding: 10px 12px; }
  input, h2, pre { font-family: ui-monospace, monospace; }
  button { padding: 8px 14px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: wait; }
  form button { background: var(--accent); border-color: var(--accent); color: #fff; }
  #examples button { padding: 2px 8px; font: 13px ui-monospace, monospace; }
  article {
    margin-top: 16px; padding: 16px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--surface);
  }
  article header { display: flex; justify-content: space-between; align-items: center; }
  article.error p { color: var(--danger); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 12px 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  pre {
    margin: 8px 0 0; padding: 12px; overflow-x: auto; border-radius: 8px;
    background: var(--background); font: 13px/1.45 ui-monospace, monospace;
  }
  summary { cursor: pointer; color: var(--muted); }
  footer { margin-top: 40px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>iplore</h1>
  <p class="muted">IP lookup that runs in your browser. No address leaves this page.</p>

  <form id="form">
    <input id="query" placeholder="Addresses, separated by spaces or commas"
      autofocus autocomplete="off" spellcheck="false" aria-label="IP addresses">
    <button disabled>Look up</button>
  </form>

  <p id="examples" class="muted">
    Try <button type="button">1.1.1.1</button> <button type="button">8.8.8.8</button>
    <button type="button">185.220.101.1</button>
    <button type="button">2a00:1450::1</button>
  </p>
  <p id="status">Loading database (19 MB)…</p>
  <section id="results"></section>

  <footer>
    <p class="muted">Same lookup in code:</p>
    <pre id="snippet"></pre>
    <p class="muted">
      <a href="https://github.com/tn3w/iplore">GitHub</a> ·
      <a href="https://github.com/tn3w/iplore/releases/latest">Downloads</a> ·
      <a href="iplore-full.ipl">iplore-full.ipl</a>
    </p>
  </footer>
</main>

<script type="module">
  import { open } from "./iplore.js";

  const form = document.querySelector("#form");
  const query = document.querySelector("#query");
  const status = document.querySelector("#status");
  const results = document.querySelector("#results");
  const snippet = document.querySelector("#snippet");
  let database;

  const element = (tag, properties = {}, ...children) => {
    const node = Object.assign(document.createElement(tag), properties);
    node.append(...children);
    return node;
  };

  const join = (...parts) => [...new Set(parts.filter(Boolean))].join(", ");

  const flag = (code) =>
    String.fromCodePoint(...[...code].map((letter) => 0x1f1a5 + letter.charCodeAt(0)));

  function rows({ place, network, abuse }) {
    const country = place?.country;
    const operator = network?.operator;
    const map = place?.lat != null &&
      `https://www.openstreetmap.org/?mlat=${place.lat}&mlon=${place.lon}`;
    const accuracy = place?.accuracy != null && join(
      `±${place.accuracy} km`,
      place.confidence != null && `${place.confidence}% confidence`,
    );

    return [
      ["Location", join(
        place?.city?.name,
        place?.region?.name,
        country?.code && `${flag(country.code)} ${country.name}`,
      ), map],
      ["Accuracy", accuracy],
      ["Network", network?.asn && join(`AS${network.asn}`, operator?.company),
        network?.asn && `https://bgp.tools/as/${network.asn}`],
      ["Category", join(operator?.category, abuse?.user_type)],
      ["Service", join(abuse?.service, abuse?.provider)],
      ["Risk", abuse?.risk ?? network?.risk],
      ["Threat", abuse?.threat],
      ["Flags", abuse?.flags?.join(", ")],
      ["Abuse contact", operator?.abuse_email],
    ].filter(([, value]) => value != null && value !== "" && value !== false);
  }

  function row([label, value, link]) {
    const content = link
      ? element("a", { href: link, target: "_blank", textContent: value })
      : String(value);
    return [element("dt", { textContent: label }), element("dd", {}, content)];
  }

  function card(address, expanded) {
    let answer;
    try {
      answer = database.lookup(address);
    } catch (error) {
      const title = element("h2", { textContent: address });
      const message = element("p", { textContent: error.message });
      return element("article", { className: "error" }, title, message);
    }

    const json = JSON.stringify(answer, null, 2);
    const copy = element("button", { type: "button", textContent: "Copy JSON" });
    copy.onclick = async () => {
      await navigator.clipboard.writeText(json);
      copy.textContent = "Copied";
    };

    const fields = rows(answer);
    const details = fields.length
      ? element("dl", {}, ...fields.flatMap(row))
      : element("p", { className: "muted", textContent: "Reserved or unknown address." });
    const raw = element("details", { open: expanded },
      element("summary", { textContent: "JSON" }), element("pre", { textContent: json }));
    const header = element("header", {}, element("h2", { textContent: address }), copy);
    return element("article", {}, header, details, raw);
  }

  function showSnippet(address = "1.1.1.1") {
    snippet.textContent = [
      `iplore iplore-full.ipl ${address}`,
      `iplore.open("iplore-full.ipl").lookup("${address}")`,
      `(await open(await fetch(url))).lookup("${address}")`,
    ].join("\n");
  }

  function lookup(text) {
    const addresses = text.split(/[\s,]+/).filter(Boolean);
    const search = addresses.map(encodeURIComponent).join(",");
    history.replaceState(null, "", search ? `?q=${search}` : location.pathname);
    const single = addresses.length === 1;
    results.replaceChildren(...addresses.map((address) => card(address, single)));
    showSnippet(addresses[0]);
  }

  async function load() {
    const started = performance.now();
    database = await open(await fetch("iplore-full.ipl"));
    const seconds = ((performance.now() - started) / 1000).toFixed(1);
    const built = database.about().built.slice(0, 10);
    status.textContent = `Database built ${built}, loaded in ${seconds} s.`;
    form.querySelector("button").disabled = false;
    if (query.value) lookup(query.value);
  }

  form.onsubmit = (event) => {
    event.preventDefault();
    if (database) lookup(query.value);
  };

  document.querySelector("#examples").onclick = ({ target }) => {
    if (target.tagName !== "BUTTON") return;
    query.value = target.textContent;
    form.requestSubmit();
  };

  query.value = new URLSearchParams(location.search).get("q") ?? "";
  showSnippet();
  load().catch((error) => {
    status.textContent = `Could not load the database: ${error.message}`;
  });
</script>
</body>
</html>
