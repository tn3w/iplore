name: Bindings

on:
  push:
    branches: [master]
    paths: [bindings/**, reader/**, Cargo.*, .github/workflows/bindings.yml]
  pull_request:
    paths: [bindings/**, reader/**, Cargo.*, .github/workflows/bindings.yml]

permissions:
  contents: read

concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: rustup target add wasm32-unknown-unknown

      - name: Native CLI
        run: |
          cargo clippy --locked -p wasm -p python -- -D warnings
          cargo build --locked --release -p reader

      - name: Databases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          mkdir -p bindings/data
          gh release download "$tag" --dir bindings/data --pattern SHA256SUMS \
            --pattern iplore-full.ipl --pattern iplore-place.ipl \
            --pattern iplore-country.ipl --pattern iplore-anonymizer.ipl \
            --pattern iplore-traffic.ipl
          cd bindings/data
          sha256sum --check --ignore-missing SHA256SUMS

      - name: JavaScript
        working-directory: bindings/js
        run: |
          npm ci
          npm run build
          ls -l dist/iplore.wasm
          npm test
          npm run test:deno
          npm run test:bun
          npm run test:workers
          npm pack --pack-destination ..

      - name: Python
        run: |
          python -m venv .venv
          .venv/bin/pip install pytest ./bindings/python
          .venv/bin/pytest bindings/python/tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: bindings/iplore-*.tgz

  wheels:
    if: github.ref == 'refs/heads/master'
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: "off" }
          - { os: macos-15-intel, target: x86_64, manylinux: "off" }
          - { os: windows-latest, target: x64, manylinux: "off" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish:
    if: github.ref == 'refs/heads/master'
    needs: [test, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bindings-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          mv release/iplore-*.tgz release/iplore.tgz
          cd release
          sha256sum * > SHA256SUMS

      - name: Create release if missing
        run: |
          gh release view bindings >/dev/null 2>&1 || gh release create bindings \
            --prerelease --latest=false --target "$GITHUB_SHA" --title "Bindings" \
            --notes "Python wheels and npm package, rebuilt on every change."

      - name: Upload assets
        run: |
          gh release upload bindings release/* --clobber
          gh release edit bindings \
            --notes "Python wheels and npm package, built from $GITHUB_SHA."

      - name: Delete stale assets
        run: |
          gh release view bindings --json assets --jq '.assets[].name' \
            | while read -r name; do
              [ -e "release/$name" ] || gh release delete-asset bindings "$name" --yes
            done
