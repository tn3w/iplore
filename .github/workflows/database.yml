name: database

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: database

env:
  KEEP_RELEASES: 3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo build --release --locked

      - name: Fetch sources
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          BGPTOOLS_USER_AGENT: ${{ secrets.BGPTOOLS_USER_AGENT }}
        run: target/release/builder fetch

      - name: Build databases
        run: |
          target/release/builder full place network place.country.code \
            abuse.service+abuse.provider+abuse.risk abuse.service \
            network.asn+network.operator.category+abuse.user_type blocklist

      - name: Name release assets
        run: |
          mkdir release
          cd dist
          cp iplore-full.ipl iplore-place.ipl iplore-network.ipl blocklist.netset \
            ../release/
          cp iplore-place.country.code.ipl ../release/iplore-country.ipl
          cp iplore-abuse.service+abuse.provider+abuse.risk.ipl \
            ../release/iplore-abuse.ipl
          cp iplore-abuse.service.ipl ../release/iplore-anonymizer.ipl
          cp iplore-network.asn+network.operator.category+abuse.user_type.ipl \
            ../release/iplore-traffic.ipl

      - name: Check union property
        run: |
          target/release/builder check release/iplore-full.ipl release/iplore-place.ipl
          target/release/builder check release/iplore-full.ipl \
            release/iplore-network.ipl
          target/release/iplore release/iplore-full.ipl 1.1.1.1

      - name: Download previous blocklist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous
          tag=$(gh release list --limit 50 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("db-"))]
              | sort | last // empty')
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern blocklist.netset --dir previous
          fi

      - name: Canary checks
        run: |
          python3 - <<'PYTHON'
          import ipaddress
          import json
          import os
          import subprocess
          import sys

          def blocklist(path):
              with open(path) as lines:
                  return [
                      ipaddress.ip_network(line.strip())
                      for line in lines
                      if line.strip() and not line.startswith("#")
                  ]

          networks = blocklist("release/blocklist.netset")
          failures = []
          for text in ["1.1.1.1", "8.8.8.8", "9.9.9.9"]:
              address = ipaddress.ip_address(text)
              output = subprocess.run(
                  ["target/release/iplore", "release/iplore-full.ipl", text],
                  capture_output=True, text=True, check=True,
              ).stdout
              risk = (json.loads(output).get("abuse") or {}).get("risk") or 0
              if risk >= 0.4:
                  failures.append(f"{text} abuse risk {risk}")
              if any(address in network for network in networks):
                  failures.append(f"{text} is in blocklist.netset")

          previous = "previous/blocklist.netset"
          if os.path.exists(previous):
              before, now = len(blocklist(previous)), len(networks)
              print(f"blocklist entries: {before} -> {now}")
              if before and abs(now - before) / before > 0.15:
                  failures.append(f"blocklist size changed {before} -> {now}")
          else:
              print("no previous blocklist, size comparison skipped")

          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PYTHON

      - name: Checksums
        run: cd release && sha256sum iplore-*.ipl blocklist.netset > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Verify checksums
        run: cd release && sha256sum --check SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Create draft release
        run: |
          tag="db-$(date -u +%F-%H%M)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Database $(date -u +%F)" \
            --notes "Weekly build. Licenses are listed in each file header.
          Verify: sha256sum -c SHA256SUMS" \
            release/*

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest

      - name: Delete old builds
        run: |
          gh release list --limit 200 --json tagName \
            --jq '[.[].tagName | select(startswith("db-"))] | sort | reverse
              | .[env.KEEP_RELEASES | tonumber:] | .[]' \
            | while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done

      - name: Remove unpublished draft
        if: failure()
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)
          if [ "$draft" = true ]; then gh release delete "$TAG" --cleanup-tag --yes; fi
